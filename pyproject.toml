[project]
name = "virtual-human"
version = "0.1.0"
description = "Private-chat virtual human data and sticker processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "imagehash>=4.3.2",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pyyaml>=6.0.2",
    "qwen-vl-utils>=0.0.14",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
