data:
  input_csv: "data/raw/chat.csv"
  processed_csv: "data/processed/processed_chat.csv"
  stickered_csv: "data/processed/stickered_chat.csv"
  sticker_metadata_jsonl: "data/outputs/sticker_metadata.jsonl"
  sticker_review_jsonl: "data/outputs/sticker_review_queue.jsonl"
  sticker_image_dir: "data/stickers"
  model_cache_dir: "models"

preprocess:
  allowed_message_types:
    - "text"
    - "sticker"

sticker:
  model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
  batch_size: 4
  gif_batch_size: 1
  gif_max_frames: 4
  phash_threshold: 5
  max_new_tokens: 256
  retry_failed: true
  min_quality_score: 0.85