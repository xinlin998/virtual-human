data:
  input_csv: "data/raw/chat.csv"
  output_dir: "data/outputs"
  processed_dir: "data/processed/prcoessed_chat.csv"
  stickered_dir: "data/processed/stickered.csv"
  model_dir: "model"

columns:
  timestamp: "CreateTime"
  sender: "is_sender"
  message_type: "type_name"
  content: "msg"
  source: "src"
  raw_index: "id"

filter:
  allowed_types:
    - "text"
    - "sticker"

sticker:
  model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
  use_4bit: true
  min_visual_tokens: 256
  max_visual_tokens: 1024
  max_new_tokens: 384
  temperature: 0.0
  use_flash_attention_2: false
  message_id_col: "message_id"
  message_type_col: "message_type"
  sticker_type_value: "sticker"
  sticker_path_col: "src"
  image_root: "data/stickers"
  phash_threshold: 5
  max_animation_frames: 3
  resume: true
  retrieval_top_k: 10 

turn:
  merge_gap_seconds: 120
  message_break_token: "<msg_break>"

session:
  hard_gap_seconds: 1800
  semantic_enabled: false
  semantic_check_min_gap_seconds: 300
  semantic_threshold: 0.30

atomic:
  long_text_min_chars: 25

reply_graph:
  candidate_window_turns: 8
  candidate_window_seconds: 3600
  min_link_score: 0.62
  high_confidence_score: 0.82
  multi_parent_threshold: 0.82
  multi_parent_margin: 0.08

sft:
  context_turns: 8
  max_context_chars: 2500
  multi_turn_ratio: 0.85

sticker:
  image_dir: "data/stickers"
  phash_threshold: 5
  retrieval_top_k: 20